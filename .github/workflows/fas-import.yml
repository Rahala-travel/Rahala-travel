name: Import post fas articles

# Manual only. Commit the "post fas" folder contents first, then run this.
# It reads post fas/<category>/<article>.txt + the image beside it, writes the
# articles to the Firebase RTDB `blogPosts` node, and commits the article images
# to images/posts/ so GitHub Pages serves them to every visitor.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import post fas articles
        run: node scripts/import-fas-posts.js
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}

      - name: Commit article images
        run: |
          if [ -z "$(git status --porcelain -- images/posts)" ]; then
            echo "No new article images to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/posts
          git commit -m "Add post fas article images"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
